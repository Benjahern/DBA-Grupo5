# Docker Compose carga automáticamente el archivo .env que está
# en el mismo directorio. Todas las variables ${VAR} se resuelven desde ahí.

services:
  db:
    image: postgres:16-alpine
    container_name: bda_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./BD/createDb.sql:/docker-entrypoint-initdb.d/createDb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    container_name: bda_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_DDL_AUTO}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./Backend:/app
      - gradle_cache:/root/.gradle
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    container_name: bda_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg_data:
  gradle_cache:

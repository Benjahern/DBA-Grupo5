# Docker Compose carga automáticamente el archivo .env que está
# en el mismo directorio. Todas las variables ${VAR} se resuelven desde ahí.

services:
  db:
    image: postgres:16-alpine
    container_name: bda_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./BD/createDb.sql:/docker-entrypoint-initdb.d/createDb.sql:ro
      - ./Backend/src/main/resources/db/index.sql:/docker-entrypoint-initdb.d/index.sql:ro
      - ./Backend/src/main/resources/db/procedure.sql:/docker-entrypoint-initdb.d/procedure.sql:ro
      - ./Backend/src/main/resources/db/triggers.sql:/docker-entrypoint-initdb.d/triggers.sql:ro
      - ./Backend/src/main/resources/db/procedures2.sql:/docker-entrypoint-initdb.d/procedures2.sql:ro
      - ./Backend/src/main/resources/db/materialized_view.sql:/docker-entrypoint-initdb.d/materialized_view.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: bda_keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./Keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    container_name: bda_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENT_ID: admin-cli
      KEYCLOAK_USERNAME: ${KEYCLOAK_ADMIN}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_TARGET_REALM: host-usach
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
      KEYCLOAK_PUBLIC_CLIENT_ID: frontend-app
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./Backend:/app
      - gradle_cache:/root/.gradle
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    container_name: bda_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg_data:
  gradle_cache:
